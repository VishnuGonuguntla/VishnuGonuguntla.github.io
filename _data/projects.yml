# =============================================================
#   PROJECTS — single source of truth for the portfolio grid
# =============================================================
# To add a project, append one entry below. Only `repo` and
# `description` are required. Everything else is optional.
#
#   repo:        "owner/name"  (required) — the GitHub repository
#   title:       display name  (optional) — defaults to the repo name
#   description: one-line summary (required)
#   language:    primary language label (optional)
#   tags:        list of topic chips (optional) — used by the filter
#   homepage:    live/demo URL (optional)
#   featured:    true to pin near the top (optional)
#
# The project card links to /project/?repo=owner/name, which renders
# that repository's README.md inside this site's layout.
# =============================================================

- repo: "VishnuGonuguntla/gpu_computation"
  title: "GPU Computation"
  description: "Learning and implementation of algorithms using Graphical Processing Units (GPU)."
  language: "C"
  featured: true
  tags:
    - "GPU"
    - "Algorithms"

- repo: "VishnuGonuguntla/mnist-classifier"
  title: "MNIST Classifier"
  description: "Implementation of a neural network for the MNIST dataset using the C++ Eigen matrix solver."
  language: "C++"
  tags:
    - "Machine Learning"
    - "Eigen"
